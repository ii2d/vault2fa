name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Vault2FA' }}
          VITE_APP_TITLE: ${{ vars.VITE_APP_TITLE || 'Zero-Knowledge TOTP Authenticator' }}
          VITE_APP_SUBTITLE: ${{ vars.VITE_APP_SUBTITLE || 'Zero-Knowledge TOTP' }}
          VITE_APP_DESCRIPTION: ${{ vars.VITE_APP_DESCRIPTION || 'Privacy-first, zero-knowledge, local-first 2FA/TOTP authenticator PWA' }}
          VITE_APP_REPO_URL: ${{ vars.VITE_APP_REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL || '' }}
          VITE_APP_THEME_COLOR: ${{ vars.VITE_APP_THEME_COLOR || '#09090b' }}

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
