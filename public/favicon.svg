<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Soft subtle background glow -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Shield Shape -->
  <path d="M256 96 L376 148 V264 C376 342 325 412 256 432 C187 412 136 342 136 264 V148 Z" 
        fill="#1e1b4b" fill-opacity="0.4" stroke="url(#accentGrad)" stroke-width="8" stroke-linejoin="round" />

  <!-- Padlock Shackle -->
  <path d="M208 240 V200 C208 173.49 229.49 152 256 152 C282.51 152 304 173.49 304 200 V240" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="188" y="232" width="136" height="112" rx="20" fill="url(#primaryGrad)" />

  <!-- Keyhole / Timer Clock Tick -->
  <circle cx="256" cy="278" r="12" fill="#ffffff" />
  <path d="M256 288 V316" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
</svg>